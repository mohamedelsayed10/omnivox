<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0c12" />
    <meta name="description" content="OmniVox: real-time voice agent console with an Inspector for the agent's internal steps." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OmniVox</title>
    <script>
      // Resolve the theme before first paint so there is no flash.
      // Stored mode: "dark" | "light" | "system" (default: system, dark when no preference).
      (function () {
        var mode = "system";
        try { mode = localStorage.getItem("omnivox.theme") || "system"; } catch (e) {}
        var q = new URLSearchParams(location.search).get("theme"); // /?theme=light|dark overrides, not persisted
        if (q === "light" || q === "dark") mode = q;
        var light = mode === "light" ||
          (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.setAttribute("data-theme", light ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
